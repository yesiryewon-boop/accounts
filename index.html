<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카드값">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>카드값 입금 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: 상단 총액 요약 → 은행별 블록(필요 잔액 + 카드 입력 행) 세로 배치. 입력과 결과가 한 블록 안에 붙어 있다. */
  :root {
    --bg: #f1f4f8;
    --surface: #ffffff;
    --ink: #172033;
    --muted: #5b6980;
    --line: #dbe2ec;
    --accent: #1f4fd6;
    --accent-ink: #ffffff;
    --accent-soft: #e5ecff;
    --field: #f7f9fc;
    --b-toss: #3b6cff;
    --b-kb: #d29a00;
    --b-mg: #1f9d63;
    --font-body: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1522;
      --surface: #171f31;
      --ink: #e8edf6;
      --muted: #98a5bb;
      --line: #2a3550;
      --accent: #7c9bff;
      --accent-ink: #0f1522;
      --accent-soft: #212e52;
      --field: #1d2740;
      --b-toss: #7c9bff;
      --b-kb: #e6b73a;
      --b-mg: #4cc78d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1522;
    --surface: #171f31;
    --ink: #e8edf6;
    --muted: #98a5bb;
    --line: #2a3550;
    --accent: #7c9bff;
    --accent-ink: #0f1522;
    --accent-soft: #212e52;
    --field: #1d2740;
    --b-toss: #7c9bff;
    --b-kb: #e6b73a;
    --b-mg: #4cc78d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 24px 48px;
  }
  .wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
  h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; text-wrap: balance; }

  .total {
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .total .lbl { font-size: 13px; opacity: 0.85; }
  .total .val { font-family: var(--font-num); font-weight: 600; font-size: 32px; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .total .sub { font-size: 12.5px; opacity: 0.85; }

  .bank {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .bank-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .bank-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .bank-name strong { font-size: 16px; }
  .bank-name small { color: var(--muted); font-size: 12.5px; }
  .need { text-align: right; margin-left: auto; }
  .need .k { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }
  .need .v { font-family: var(--font-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1.4fr);
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row-name { display: flex; flex-direction: column; min-width: 0; }
  .row-name b { font-weight: 500; }
  .row-name select {
    margin-top: 2px;
    width: max-content;
    max-width: 100%;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  label.mini { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); min-width: 0; }

  input[type="text"], input[type="number"] {
    width: 100%;
    min-width: 0;
    font-family: var(--font-num);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .amt { text-align: right; }
  input.day { text-align: center; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { padding: 14px 16px; color: var(--muted); font-size: 13px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 500;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.warn { color: var(--muted); }
  .note { font-size: 12.5px; color: var(--muted); margin: 0; }

  @media (max-width: 430px) {
    .row { grid-template-columns: minmax(0, 1fr) 64px; }
    .row .amt-wrap { grid-column: 1 / -1; }
    .total .val { font-size: 28px; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="monthLabel"></span>
    <h1>카드값 입금 계산기</h1>
  </header>

  <section class="total" aria-live="polite">
    <span class="lbl">이번 달 카드 청구금액 합계</span>
    <span class="val" id="grand">0원</span>
    <span class="sub" id="grandSub">카드별 청구금액을 입력하면 은행별 필요 잔액이 계산됩니다.</span>
  </section>

  <main id="app" class="wrap" style="gap:16px"></main>

  <div class="actions">
    <button class="primary" id="copy" type="button">계산 결과 복사</button>
    <button class="warn" id="reset" type="button">금액 초기화</button>
  </div>
  <p class="note">입력한 금액, 결제일, 카드의 은행 지정은 이 브라우저에 저장됩니다. 매달 초기화 후 새로 입력하면 됩니다.</p>
</div>

<script>
(function () {
  var KEY = 'card-deposit-v1';
  var BANKS = [
    { id: 'toss', name: '토스뱅크', color: 'var(--b-toss)' },
    { id: 'kb',   name: '국민은행', color: 'var(--b-kb)' },
    { id: 'mg',   name: '새마을금고', color: 'var(--b-mg)' }
  ];
  var DEFAULT_CARDS = [
    { id: 'hyundai', name: '현대카드', bank: 'toss', day: '12', amount: 0 },
    { id: 'lotte',   name: '롯데카드', bank: 'toss', day: '14', amount: 0 },
    { id: 'samsung', name: '삼성카드', bank: 'kb',   day: '13', amount: 0 },
    { id: 'shinhan', name: '신한카드', bank: 'kb',   day: '14', amount: 0 },
    { id: 'kookmin', name: '국민카드', bank: 'kb',   day: '14', amount: 0 },
    { id: 'hana',    name: '하나카드', bank: 'mg',   day: '13', amount: 0 }
  ];

  var cards = load();
  var app = document.getElementById('app');
  var grandEl = document.getElementById('grand');
  var grandSub = document.getElementById('grandSub');

  document.getElementById('monthLabel').textContent = (new Date().getMonth() + 1) + '월 초 입력';

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        return DEFAULT_CARDS.map(function (d) {
          var s = saved.filter(function (x) { return x.id === d.id; })[0];
          if (!s) return Object.assign({}, d);
          var bankOk = BANKS.some(function (b) { return b.id === s.bank; });
          return { id: d.id, name: d.name, bank: bankOk ? s.bank : d.bank, day: s.day || d.day, amount: Number(s.amount) || 0 };
        });
      }
    } catch (e) {}
    return DEFAULT_CARDS.map(function (d) { return Object.assign({}, d); });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(cards)); } catch (e) {}
  }

  function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function fmt(n) { return n ? Math.round(n).toLocaleString('ko-KR') : ''; }
  function digits(s) { return Number(String(s).replace(/[^0-9]/g, '')) || 0; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function bankTotal(id) {
    return cards.filter(function (c) { return c.bank === id; }).reduce(function (s, c) { return s + c.amount; }, 0);
  }
  function earliestDay(id) {
    var days = cards.filter(function (c) { return c.bank === id && c.day; }).map(function (c) { return Number(c.day); });
    return days.length ? Math.min.apply(null, days) : null;
  }

  function render() {
    app.innerHTML = BANKS.map(function (b) {
      var list = cards.filter(function (c) { return c.bank === b.id; });
      var rows = list.length ? list.map(function (c) {
        var opts = BANKS.map(function (o) {
          return '<option value="' + o.id + '"' + (o.id === c.bank ? ' selected' : '') + '>' + o.name + ' 출금</option>';
        }).join('');
        return '<div class="row" data-id="' + c.id + '">' +
          '<div class="row-name"><b>' + esc(c.name) + '</b>' +
          '<select data-act="bank" aria-label="' + esc(c.name) + ' 출금 은행">' + opts + '</select></div>' +
          '<label class="mini">결제일<input class="day" type="number" min="1" max="31" inputmode="numeric" data-act="day" placeholder="일" value="' + esc(c.day) + '" id="day-' + c.id + '"></label>' +
          '<label class="mini amt-wrap">청구금액<input class="amt" type="text" inputmode="numeric" data-act="amount" placeholder="0" value="' + fmt(c.amount) + '" id="amt-' + c.id + '"></label>' +
          '</div>';
      }).join('') : '<div class="empty">이 은행에서 출금되는 카드가 없습니다.</div>';
      return '<section class="bank" data-bank="' + b.id + '">' +
        '<div class="bank-head"><div class="bank-name"><span class="dot" style="background:' + b.color + '"></span>' +
        '<div><strong>' + b.name + '</strong><br><small data-role="meta"></small></div></div>' +
        '<div class="need"><span class="k">입금해 둘 금액</span><span class="v" data-role="need">0원</span></div></div>' +
        '<div class="rows">' + rows + '</div></section>';
    }).join('');
    updateTotals();
  }

  function updateTotals() {
    var total = 0;
    BANKS.forEach(function (b) {
      var sec = app.querySelector('[data-bank="' + b.id + '"]');
      if (!sec) return;
      var t = bankTotal(b.id);
      total += t;
      sec.querySelector('[data-role="need"]').textContent = won(t);
      var n = cards.filter(function (c) { return c.bank === b.id; }).length;
      var d = earliestDay(b.id);
      sec.querySelector('[data-role="meta"]').textContent = '카드 ' + n + '장' + (d ? ' · 가장 빠른 결제일 ' + d + '일' : '');
    });
    grandEl.textContent = won(total);
    var filled = cards.filter(function (c) { return c.amount > 0; }).length;
    grandSub.textContent = filled === 0
      ? '카드별 청구금액을 입력하면 은행별 필요 잔액이 계산됩니다.'
      : '카드 ' + cards.length + '장 중 ' + filled + '장 입력됨';
  }

  app.addEventListener('input', function (e) {
    var t = e.target, row = t.closest('.row');
    if (!row) return;
    var c = cards.filter(function (x) { return x.id === row.dataset.id; })[0];
    if (t.dataset.act === 'amount') c.amount = digits(t.value);
    if (t.dataset.act === 'day') c.day = t.value;
    save();
    updateTotals();
  });
  app.addEventListener('focusout', function (e) {
    if (e.target.dataset && e.target.dataset.act === 'amount') {
      var row = e.target.closest('.row');
      var c = cards.filter(function (x) { return x.id === row.dataset.id; })[0];
      e.target.value = fmt(c.amount);
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.act !== 'bank') return;
    var row = t.closest('.row');
    var c = cards.filter(function (x) { return x.id === row.dataset.id; })[0];
    c.bank = t.value;
    save();
    render();
  });

  var resetBtn = document.getElementById('reset');
  var resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (resetBtn.dataset.armed === '1') {
      cards.forEach(function (c) { c.amount = 0; });
      save();
      render();
      resetBtn.dataset.armed = '';
      resetBtn.textContent = '금액 초기화';
      clearTimeout(resetTimer);
    } else {
      resetBtn.dataset.armed = '1';
      resetBtn.textContent = '한 번 더 누르면 초기화';
      resetTimer = setTimeout(function () {
        resetBtn.dataset.armed = '';
        resetBtn.textContent = '금액 초기화';
      }, 4000);
    }
  });

  var copyBtn = document.getElementById('copy');
  copyBtn.addEventListener('click', function () {
    var lines = ['[' + (new Date().getMonth() + 1) + '월 카드 결제 대비 입금액]'];
    BANKS.forEach(function (b) {
      var names = cards.filter(function (c) { return c.bank === b.id; }).map(function (c) { return c.name.replace('카드', '') + ' ' + (fmt(c.amount) || '0'); });
      lines.push(b.name + ' ' + won(bankTotal(b.id)) + (names.length ? ' (' + names.join(', ') + ')' : ''));
    });
    lines.push('합계 ' + won(cards.reduce(function (s, c) { return s + c.amount; }, 0)));
    var text = lines.join('\n');
    function done(ok) {
      copyBtn.textContent = ok ? '복사했습니다' : '복사하지 못했습니다. 직접 선택해 주세요';
      setTimeout(function () { copyBtn.textContent = '계산 결과 복사'; }, 2200);
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } catch (e) { done(false); }
  });

  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
